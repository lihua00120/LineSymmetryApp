<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>線對稱圖形三步驟教室</title>
<style>
  :root {
    --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-400:#94a3b8;
    --slate-600:#475569; --slate-800:#1e293b;
    --blue:#3b82f6; --blue-600:#2563eb; --green:#10b981; --purple:#a855f7; --purple-600:#9333ea; --orange:#f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--slate-50); color: var(--slate-800);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    padding-bottom: 48px;
  }
  header {
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1);
    padding: 24px 16px 20px; margin-bottom: 24px; border-bottom: 4px solid #60a5fa;
  }
  h1 { margin: 0; text-align: center; font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 800; }
  h1 span { color: var(--blue-600); }

  .steps { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;
           font-weight: 700; font-size: clamp(.95rem, 2.8vw, 1.15rem); }
  header .steps { margin-top: 14px; }
  .steps .chip { padding: 4px 16px; border-radius: 999px; border: 2px solid; transition: opacity .25s, transform .25s; }
  .chip.s1 { background:#ffedd5; color:#c2410c; border-color:#fdba74; }
  .chip.s2 { background:#dcfce7; color:#15803d; border-color:#86efac; }
  .chip.s3 { background:#dbeafe; color:#1d4ed8; border-color:#93c5fd; }
  .steps .arrow { color: var(--slate-400); font-size: 1.3rem; }
  .steps.live .chip { opacity: .3; }
  .steps.live .chip.on { opacity: 1; transform: scale(1.12); }

  main { max-width: 56rem; margin: 0 auto; padding: 0 16px; }
  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 24px; }
  .tab {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 12px 24px; border-radius: 16px; font: inherit; font-weight: 700; font-size: 1.1rem;
    background: #fff; color: var(--slate-600); border: 1px solid var(--slate-200);
    box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: all .25s;
  }
  .tab:hover { background: var(--slate-100); }
  .tab.active { color: #fff; transform: scale(1.05); box-shadow: 0 8px 16px rgba(0,0,0,.18); border-color: transparent; }
  .tab.blue.active { background: var(--blue); }
  .tab.green.active { background: var(--green); }
  .tab.purple.active { background: var(--purple); }

  .card {
    background: #fff; border-radius: 24px; border: 1px solid var(--slate-200);
    box-shadow: 0 20px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.1);
    padding: 16px; min-height: 560px; display: flex; justify-content: center;
  }
  @media (min-width: 640px) { .card { padding: 28px; } }
  .panel { display: none; width: 100%; }
  .panel.active { display: block; animation: fade .4s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 20px; }
  .level {
    cursor: pointer; font: inherit; font-weight: 700; padding: 8px 20px; border-radius: 999px;
    background: #fff; color: #7e22ce; border: 1px solid #e9d5ff; transition: all .2s;
  }
  .level:hover { background: #faf5ff; }
  .level.active { background: var(--purple-600); color: #fff; border-color: var(--purple-600); box-shadow: 0 4px 8px rgba(0,0,0,.15); }

  .activity { display: none; flex-direction: column; align-items: center; }
  .activity.active { display: flex; }

  .feedback {
    width: 100%; max-width: 28rem; padding: 14px; border-radius: 12px; border: 2px solid;
    font-weight: 700; font-size: 1.15rem; text-align: center; margin-bottom: 14px; line-height: 1.5;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .feedback.info    { background:#eff6ff; border-color:#93c5fd; color:#1d4ed8; }
  .feedback.success { background:#f0fdf4; border-color:#86efac; color:#15803d; }
  .feedback.error   { background:#fef2f2; border-color:#fca5a5; color:#b91c1c; animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .caption {
    width: 100%; max-width: 28rem; text-align: center; font-weight: 800; font-size: 1.6rem;
    color: var(--slate-800); margin: 12px 0; min-height: 2.4rem;
  }

  .bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 14px; min-height: 42px; }
  .bar.below { margin: 14px 0 0; }
  .btn {
    cursor: pointer; border: 0; font: inherit; font-weight: 700; padding: 8px 20px; border-radius: 999px;
    box-shadow: 0 2px 4px rgba(0,0,0,.18); display: inline-flex; align-items: center; gap: 6px; font-size: 1rem;
  }
  .btn:active { transform: scale(.96); }
  .btn.gray   { background:#e5e7eb; color:#374151; }
  .btn.gray:hover { background:#d1d5db; }
  .btn.purple { background: var(--purple); color:#fff; padding: 8px 24px; }
  .btn.purple:hover { background: var(--purple-600); }
  .btn.blue   { background: var(--blue); color:#fff; padding: 8px 24px; }
  .btn.blue:hover { background: var(--blue-600); }
  .btn.green  { background: var(--green); color:#fff; padding: 8px 24px; }
  .btn.round  { width: 52px; height: 52px; padding: 0; justify-content: center; font-size: 1.3rem; }

  svg.board {
    width: 100%; max-width: 28rem; background: #fff; border-radius: 8px;
    border: 2px solid #d1d5db; box-shadow: inset 0 2px 4px rgba(0,0,0,.06);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  svg.board.tap { cursor: crosshair; }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 1.1s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .3s ease; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
</style>
</head>
<body>

<header>
  <h1>🎨 線對稱圖形<span>三步驟</span>教室</h1>
  <div class="steps">
    <span class="chip s1">1 數格子</span><span class="arrow">➜</span>
    <span class="chip s2">2 畫點</span><span class="arrow">➜</span>
    <span class="chip s3">3 描線</span>
  </div>
</header>

<main>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <div class="panel" id="panel-demo"></div>
    <div class="panel" id="panel-practice"></div>
    <div class="panel" id="panel-challenge">
      <div class="levels" id="levels"></div>
      <div id="challenge-boards"></div>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';
  const GRID_SIZE = 12;
  const NS = 'http://www.w3.org/2000/svg';

  // ---------- 工具函式 ----------
  const mirror = (p, axisType = 'vertical', axisPos = 6) =>
    axisType === 'vertical'
      ? { x: axisPos + (axisPos - p.x), y: p.y }
      : { x: p.x, y: axisPos + (axisPos - p.y) };
  const same = (a, b) => !!a && !!b && a.x === b.x && a.y === b.y;
  const uniq = arr => arr.filter((p, i) => arr.findIndex(q => same(p, q)) === i);

  function gridCoords(e, svg) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return {
      x: Math.max(0, Math.min(GRID_SIZE, Math.round(p.x))),
      y: Math.max(0, Math.min(GRID_SIZE, Math.round(p.y)))
    };
  }
  function s(tag, attrs, parent) {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  }
  function h(tag, cls, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text) el.textContent = text;
    if (parent) parent.appendChild(el);
    return el;
  }

  // ---------- 繪圖元件 ----------
  const BLUE_FILL = 'rgba(59, 130, 246, 0.2)', GREEN_FILL = 'rgba(16, 185, 129, 0.2)';
  const GREEN = '#10b981', BLUE = '#3b82f6', ORANGE = '#f59e0b';

  function drawGrid(g, axisType, axisPos = 6) {
    for (let i = 0; i <= GRID_SIZE; i++) {
      s('line', { x1: 0, y1: i, x2: GRID_SIZE, y2: i, stroke: '#e5e7eb', 'stroke-width': .05 }, g);
      s('line', { x1: i, y1: 0, x2: i, y2: GRID_SIZE, stroke: '#e5e7eb', 'stroke-width': .05 }, g);
    }
    if (axisType === 'vertical')
      s('line', { x1: axisPos, y1: 0, x2: axisPos, y2: GRID_SIZE, stroke: '#ef4444', 'stroke-width': .15 }, g);
    else
      s('line', { x1: 0, y1: axisPos, x2: GRID_SIZE, y2: axisPos, stroke: '#ef4444', 'stroke-width': .15 }, g);
  }
  const pathD = (pts, closed) =>
    pts.map((p, i) => (i === 0 ? 'M' : 'L') + ' ' + p.x + ' ' + p.y).join(' ') + (closed ? ' Z' : '');

  function drawPolygon(g, pts, fill, stroke) {
    if (!pts.length) return;
    s('path', { d: pathD(pts, pts.length > 2), fill, stroke, 'stroke-width': .15, 'stroke-linejoin': 'round' }, g);
    pts.forEach(p => s('circle', { cx: p.x, cy: p.y, r: .2, fill: stroke }, g));
  }
  function drawPath(g, pts, stroke, closed, fill) {
    if (!pts.length) return;
    s('path', { d: pathD(pts, closed), fill: closed ? fill : 'none', stroke,
      'stroke-width': .15, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  }
  const drawDot = (g, p, r, fill, pop = true) => s('circle', { cx: p.x, cy: p.y, r, fill, class: pop ? 'pop' : '' }, g);
  const drawPing = (g, p, r, stroke) =>
    s('circle', { cx: p.x, cy: p.y, r, fill: 'none', stroke, 'stroke-width': .1, class: 'ping' }, g);
  function numTag(g, x, y, n, color) {
    s('circle', { cx: x, cy: y, r: .33, fill: color }, g);
    const t = s('text', { x, y: y + .13, 'font-size': .42, fill: '#fff', 'text-anchor': 'middle', 'font-weight': 'bold' }, g);
    t.textContent = n;
  }

  // ---------- 連線：不用照順序，只要跟左邊一樣 ----------
  const sameEdge = (e, a, b) => (same(e[0], a) && same(e[1], b)) || (same(e[0], b) && same(e[1], a));
  function edgesOf(pts) {                       // 圖形上有哪些線（不重複）
    const list = [], n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      if (same(a, b)) continue;
      if (!list.some(e => sameEdge(e, a, b))) list.push([a, b]);
    }
    return list;
  }
  function newConn(full) {                      // full：右邊對應點（照左邊順序）
    return { full, pts: uniq(full), req: edgesOf(full), first: null, drawn: [] };
  }
  // 回傳 true 代表全部連完
  function connClick(c, pt, api) {
    if (!c.pts.some(p => same(p, pt))) { api.setMsg('點綠色的點', 'error'); return false; }
    if (!c.first) { c.first = pt; api.setMsg('再點另一個點', 'info'); return false; }
    if (same(c.first, pt)) { c.first = null; api.setMsg('點一個綠點開始連', 'info'); return false; }
    if (!c.req.some(e => sameEdge(e, c.first, pt))) { api.setMsg('左邊沒有這條線', 'error'); return false; }
    if (c.drawn.some(e => sameEdge(e, c.first, pt))) { api.setMsg('這條連過了', 'error'); return false; }
    c.drawn.push([c.first, pt]);
    c.first = pt;
    if (c.drawn.length === c.req.length) { c.first = null; return true; }
    api.setMsg('對了！繼續連', 'success');
    return false;
  }
  function drawConn(g, c, done) {
    if (done) drawPath(g, c.full, GREEN, true, GREEN_FILL);
    else c.drawn.forEach(e => s('line', { x1: e[0].x, y1: e[0].y, x2: e[1].x, y2: e[1].y,
      stroke: GREEN, 'stroke-width': .15, 'stroke-linecap': 'round' }, g));
    c.pts.forEach(p => drawDot(g, p, .25, GREEN, false));
    if (c.first) {
      s('circle', { cx: c.first.x, cy: c.first.y, r: .42, fill: 'none', stroke: ORANGE, 'stroke-width': .12 }, g);
      drawPing(g, c.first, .42, ORANGE);
    }
  }

  // ---------- 共用互動板子 ----------
  function mountActivity(container, cfg) {
    const wrap = h('div', 'activity', null, container);
    const fb = h('div', 'feedback info', null, wrap);
    const bar = h('div', 'bar', null, wrap);
    const svg = s('svg', { viewBox: '-1 -1 14 14', class: 'board tap' }, wrap);
    let impl;
    const api = {
      setMsg(text, type) {
        fb.className = 'feedback ' + type;
        fb.textContent = (type === 'error' ? '❌ ' : type === 'success' ? '✅ ' : '💡 ') + text;
      },
      redraw() {
        svg.innerHTML = '';
        const g = s('g', {}, svg);
        drawGrid(g, cfg.axis || 'vertical');
        impl.draw(g);
        bar.innerHTML = '';
        impl.buttons().forEach(b => h('button', 'btn ' + b.cls, b.label, bar).addEventListener('click', b.fn));
      }
    };
    impl = cfg.create(api);
    svg.addEventListener('pointerdown', e => { e.preventDefault(); impl.onPoint(gridCoords(e, svg)); });
    api.redraw();
    return wrap;
  }
  const resetBtn = (label, fn) => ({ label: '↺ ' + label, cls: 'gray', fn });
  const checkBtn = fn => ({ label: '✔ 檢查', cls: 'purple', fn });

  // ---------- 分頁 1：看動畫 ----------
  function mountAnimation(container) {
    const orig = [{ x: 2, y: 3 }, { x: 4, y: 7 }, { x: 2, y: 9 }];
    const DELAY = 800;

    // 把整段動畫拆成一格一格的小步驟
    const ticks = [];
    orig.forEach((o, i) => {
      const d = Math.abs(o.x - 6);
      for (let n = 1; n <= d; n++) ticks.push({ k: 'L', i, n, d });
      for (let n = 1; n <= d; n++) ticks.push({ k: 'R', i, n, d });
      ticks.push({ k: 'dot', i, d });
    });
    orig.forEach((_, i) => ticks.push({ k: 'seg', a: i, b: (i + 1) % orig.length }));
    ticks.push({ k: 'done' });

    const wrap = h('div', 'activity active', null, container);
    const stepBar = h('div', 'steps live', null, wrap);
    const chips = [['s1', '1 數格子'], ['s2', '2 畫點'], ['s3', '3 描線']].map(([c, t], i) => {
      const el = h('span', 'chip ' + c, t, stepBar);
      if (i < 2) h('span', 'arrow', '➜', stepBar);
      return el;
    });
    const cap = h('div', 'caption', null, wrap);
    const svg = s('svg', { viewBox: '-1 -1 14 14', class: 'board' }, wrap);
    const bar = h('div', 'bar below', null, wrap);

    let t = -1, timer = null;
    const playing = () => timer !== null;
    function stop() { if (timer) { clearTimeout(timer); timer = null; } updateBtns(); }
    function loop() {
      timer = setTimeout(() => {
        timer = null;
        if (t < ticks.length - 1) { t++; render(); loop(); } else updateBtns();
      }, DELAY);
      updateBtns();
    }
    function play() { if (t >= ticks.length - 1) { t = -1; render(); } loop(); }

    function render() {
      svg.innerHTML = '';
      const g = s('g', {}, svg);
      drawGrid(g, 'vertical');
      const cur = t >= 0 ? ticks[t] : null;
      const finished = cur && cur.k === 'done';

      if (!finished) drawPolygon(g, orig, BLUE_FILL, BLUE);
      else drawPolygon(g, orig, BLUE_FILL, BLUE);

      // 累積狀態：已畫好的點、已連的線
      const dots = [], segs = [];
      for (let j = 0; j <= t; j++) {
        const k = ticks[j];
        if (k.k === 'dot') dots.push({ i: k.i, fresh: j === t });
        if (k.k === 'seg') segs.push(k);
      }

      // 數格子輔助線（只顯示現在這個點）
      if (cur && (cur.k === 'L' || cur.k === 'R' || cur.k === 'dot')) {
        const o = orig[cur.i];
        const leftN = cur.k === 'L' ? cur.n : cur.d;
        const rightN = cur.k === 'R' ? cur.n : (cur.k === 'dot' ? cur.d : 0);
        drawPing(g, o, .4, ORANGE);
        s('line', { x1: o.x, y1: o.y, x2: o.x + leftN, y2: o.y, stroke: ORANGE, 'stroke-width': .14, 'stroke-linecap': 'round' }, g);
        for (let k = 1; k <= leftN; k++) numTag(g, o.x + k - .5, o.y, k, ORANGE);
        if (rightN > 0) {
          s('line', { x1: 6, y1: o.y, x2: 6 + rightN, y2: o.y, stroke: GREEN, 'stroke-width': .14, 'stroke-linecap': 'round' }, g);
          for (let k = 1; k <= rightN; k++) numTag(g, 6 + k - .5, o.y, k, GREEN);
        }
      }

      dots.forEach(d => drawDot(g, mirror(orig[d.i]), .28, GREEN, d.fresh));

      if (finished) {
        drawPath(g, orig.map(p => mirror(p)), GREEN, true, GREEN_FILL);
        orig.forEach(p => drawDot(g, mirror(p), .25, GREEN, false));
      } else {
        segs.forEach(sg => s('line', { x1: mirror(orig[sg.a]).x, y1: mirror(orig[sg.a]).y,
          x2: mirror(orig[sg.b]).x, y2: mirror(orig[sg.b]).y,
          stroke: GREEN, 'stroke-width': .15, 'stroke-linecap': 'round' }, g));
      }

      // 步驟燈號與標題
      const step = !cur ? -1 : cur.k === 'L' ? 0 : (cur.k === 'R' || cur.k === 'dot') ? 1 : 2;
      chips.forEach((c, i) => c.classList.toggle('on', i === step));
      cap.textContent = !cur ? '按 ▶ 開始' :
        cur.k === 'L' ? '數  ' + cur.n :
        cur.k === 'R' ? '再數  ' + cur.n :
        cur.k === 'dot' ? '畫點！' :
        cur.k === 'seg' ? '連線' : '完成 🎉';
      cap.style.color = cur && cur.k === 'L' ? '#c2410c' : cur && (cur.k === 'R' || cur.k === 'dot') ? '#15803d' : '#1e293b';
      updateBtns();
    }

    // 控制鈕
    const btnPrev = h('button', 'btn gray round', '⏮', bar);
    const btnPlay = h('button', 'btn blue round', '▶', bar);
    const btnNext = h('button', 'btn gray round', '⏭', bar);
    const btnAgain = h('button', 'btn gray', '↺ 重播', bar);
    btnPrev.title = '上一格'; btnNext.title = '下一格';
    function updateBtns() {
      btnPlay.textContent = playing() ? '⏸' : '▶';
      btnPrev.disabled = t < 0; btnPrev.style.opacity = t < 0 ? .4 : 1;
      btnNext.disabled = t >= ticks.length - 1; btnNext.style.opacity = t >= ticks.length - 1 ? .4 : 1;
    }
    btnPlay.addEventListener('click', () => playing() ? stop() : play());
    btnPrev.addEventListener('click', () => { stop(); if (t >= 0) { t--; render(); } });
    btnNext.addEventListener('click', () => { stop(); if (t < ticks.length - 1) { t++; render(); } });
    btnAgain.addEventListener('click', () => { stop(); t = -1; render(); play(); });

    render();
    return { stop, start() { if (t < 0 || t >= ticks.length - 1) { t = -1; render(); } if (!playing()) loop(); } };
  }

  // ---------- 分頁 2：跟著做 ----------
  function createPractice(api) {
    const rounds = [
      { shape: [{ x: 2, y: 3 }, { x: 4, y: 5 }, { x: 4, y: 8 }, { x: 1, y: 10 }], hint: true },
      { shape: [{ x: 1, y: 2 }, { x: 5, y: 3 }, { x: 3, y: 6 }, { x: 5, y: 9 }, { x: 2, y: 10 }], hint: false }
    ];
    let r = 0, orig, hint, phase, sel, map, conn;
    function start() {
      orig = rounds[r].shape; hint = rounds[r].hint;
      phase = 'select'; sel = null; map = {}; conn = null;
      api.setMsg((rounds.length > 1 ? '第 ' + (r + 1) + ' 題　' : '') + '點一個藍點', 'info');
    }
    start();

    return {
      onPoint(pt) {
        if (phase === 'select') {
          const i = orig.findIndex(p => same(p, pt));
          if (i === -1) api.setMsg('點藍色的點', 'error');
          else if (map[i]) api.setMsg('這個點畫過了', 'error');
          else {
            sel = i; phase = 'plot';
            api.setMsg(hint ? '離紅線 ' + Math.abs(orig[i].x - 6) + ' 格。點右邊對應的位置' : '點右邊對應的位置', 'info');
          }
        } else if (phase === 'plot') {
          const o = orig[sel];
          if (same(pt, mirror(o))) {
            map[sel] = pt; sel = null;
            if (Object.keys(map).length === orig.length) {
              phase = 'connect'; conn = newConn(orig.map(p => mirror(p)));
              api.setMsg('跟左邊一樣，把點連起來', 'success');
            }
            else { phase = 'select'; api.setMsg('對了！再選一個藍點', 'success'); }
          } else {
            const d = Math.abs(o.x - 6);
            api.setMsg(hint ? '再數一次，要 ' + d + ' 格' : '再數一次格子', 'error');
          }
        } else if (phase === 'connect') {
          if (connClick(conn, pt, api)) {
            phase = 'done';
            api.setMsg(r < rounds.length - 1 ? '完成！' : '全部完成！去挑戰吧', 'success');
          }
        }
        api.redraw();
      },
      draw(g) {
        drawPolygon(g, orig, BLUE_FILL, BLUE);
        if (phase === 'select') orig.forEach((p, i) => { if (!map[i]) drawPing(g, p, .4, BLUE); });
        if (phase === 'plot' && sel !== null) {
          const o = orig[sel];
          drawDot(g, o, .3, ORANGE, false);
          if (hint) {
            s('line', { x1: o.x, y1: o.y, x2: 6, y2: o.y, stroke: ORANGE, 'stroke-width': .12, 'stroke-dasharray': '0.2 0.2' }, g);
            const d = Math.abs(o.x - 6);
            for (let k = 1; k <= d; k++) numTag(g, o.x + k - .5, o.y, k, ORANGE);
          }
        }
        if (conn) drawConn(g, conn, phase === 'done');
        else Object.values(map).forEach(p => drawDot(g, p, .25, GREEN, false));
      },
      buttons() {
        const list = [];
        if (phase === 'done') {
          if (r < rounds.length - 1) list.push({ label: '下一題 ➜', cls: 'green', fn() { r++; start(); api.redraw(); } });
          else list.push({ label: '去挑戰 ➜', cls: 'green', fn() { showTab('challenge'); } });
        }
        list.push(resetBtn('重來', () => { start(); api.redraw(); }));
        return list;
      }
    };
  }

  // ---------- 分頁 3：挑戰區 ----------
  function createChallenge(opts) {
    return function (api) {
      let phase = 'plot', plotted = [], conn = null;
      api.setMsg(opts.start, 'info');
      return {
        onPoint(pt) {
          if (phase === 'plot') {
            if (opts.wrongSide(pt)) { api.setMsg(opts.sideMsg, 'error'); return; }
            const i = plotted.findIndex(p => same(p, pt));
            if (i !== -1) plotted.splice(i, 1); else plotted.push(pt);
          } else if (phase === 'connect') {
            if (connClick(conn, pt, api)) { phase = 'done'; api.setMsg(opts.winMsg, 'success'); }
          }
          api.redraw();
        },
        draw(g) {
          drawPolygon(g, opts.orig, BLUE_FILL, BLUE);
          if (conn && (phase === 'connect' || phase === 'done')) drawConn(g, conn, phase === 'done');
          else plotted.forEach(p => drawDot(g, p, .25, GREEN));
        },
        buttons() {
          const list = [];
          if (phase === 'plot') list.push(checkBtn(() => {
            if (plotted.length !== opts.orig.length) api.setMsg('要 ' + opts.orig.length + ' 個點', 'error');
            else if (!opts.orig.every(p => plotted.some(q => same(q, mirror(p, opts.axis))))) api.setMsg('有點不對，再數數格子', 'error');
            else {
              phase = 'connect'; conn = newConn(opts.orig.map(p => mirror(p, opts.axis)));
              api.setMsg('全對！跟左邊一樣連起來', 'success');
            }
            api.redraw();
          }));
          list.push(resetBtn('重來', () => {
            phase = 'plot'; plotted = []; conn = null;
            api.setMsg(opts.start, 'info'); api.redraw();
          }));
          return list;
        }
      };
    };
  }

  const createL1 = createChallenge({
    orig: [{ x: 2, y: 1 }, { x: 5, y: 3 }, { x: 3, y: 4 }, { x: 5, y: 7 }, { x: 2, y: 10 }, { x: 1, y: 5 }], axis: 'vertical',
    start: '畫出右邊的點，再按「檢查」',
    wrongSide: pt => pt.x <= 6, sideMsg: '畫在紅線右邊',
    winMsg: '第一關過關！'
  });
  const createL2 = createChallenge({
    orig: [{ x: 2, y: 1 }, { x: 6, y: 3 }, { x: 10, y: 1 }, { x: 8, y: 5 }], axis: 'horizontal',
    start: '紅線橫的了！畫在下面，再按「檢查」',
    wrongSide: pt => pt.y <= 6, sideMsg: '畫在紅線下面',
    winMsg: '第二關過關！'
  });

  function createL3(api) {
    const START = '在紅線左邊點出你的圖形';
    let phase = 'design', orig = [], plotted = [], conn = null;
    api.setMsg(START, 'info');
    return {
      onPoint(pt) {
        if (phase === 'design') {
          if (pt.x > 6) { api.setMsg('畫在紅線左邊', 'error'); return; }
          if (same(orig[orig.length - 1], pt)) { api.setMsg('這個點剛剛點過了', 'error'); return; }
          orig.push(pt); api.setMsg('點好後按「完成設計」', 'info');
        } else if (phase === 'plot') {
          if (pt.x <= 6) { api.setMsg('畫在紅線右邊', 'error'); return; }
          const i = plotted.findIndex(p => same(p, pt));
          if (i !== -1) plotted.splice(i, 1); else plotted.push(pt);
        } else if (phase === 'connect') {
          if (connClick(conn, pt, api)) { phase = 'done'; api.setMsg('你的作品完成了！', 'success'); }
        }
        api.redraw();
      },
      draw(g) {
        drawPath(g, orig, BLUE, phase !== 'design', BLUE_FILL);
        orig.forEach(p => s('circle', { cx: p.x, cy: p.y, r: .2, fill: BLUE }, g));
        if (conn && (phase === 'connect' || phase === 'done')) drawConn(g, conn, phase === 'done');
        else plotted.forEach(p => drawDot(g, p, .25, GREEN));
      },
      buttons() {
        const list = [];
        if (phase === 'design') list.push({
          label: '✎ 完成設計', cls: 'blue', fn() {
            if (uniq(orig).length < 3) { api.setMsg('至少 3 個不同的點', 'error'); api.redraw(); return; }
            phase = 'plot'; api.setMsg('畫出右邊的點', 'success'); api.redraw();
          }
        });
        if (phase === 'plot') list.push(checkBtn(() => {
          const need = uniq(orig);
          if (plotted.length !== need.length) api.setMsg('要 ' + need.length + ' 個點', 'error');
          else if (!need.every(p => plotted.some(q => same(q, mirror(p))))) api.setMsg('有點不對，再數數格子', 'error');
          else {
            phase = 'connect'; conn = newConn(orig.map(p => mirror(p)));
            api.setMsg('全對！跟左邊一樣連起來', 'success');
          }
          api.redraw();
        }));
        list.push(resetBtn('重來', () => {
          phase = 'design'; orig = []; plotted = []; conn = null;
          api.setMsg(START, 'info'); api.redraw();
        }));
        return list;
      }
    };
  }

  // ---------- 組裝畫面 ----------
  const anim = mountAnimation(document.getElementById('panel-demo'));
  mountActivity(document.getElementById('panel-practice'), { axis: 'vertical', create: createPractice }).classList.add('active');

  const boards = document.getElementById('challenge-boards');
  const challengeEls = [
    mountActivity(boards, { axis: 'vertical',   create: createL1 }),
    mountActivity(boards, { axis: 'horizontal', create: createL2 }),
    mountActivity(boards, { axis: 'vertical',   create: createL3 })
  ];
  const levelBtns = ['第一關', '第二關', '第三關'].map((name, i) => {
    const b = h('button', 'level', name, document.getElementById('levels'));
    b.addEventListener('click', () => showLevel(i));
    return b;
  });
  function showLevel(i) {
    challengeEls.forEach((el, j) => el.classList.toggle('active', i === j));
    levelBtns.forEach((b, j) => b.classList.toggle('active', i === j));
  }
  showLevel(0);

  const tabDefs = [
    { id: 'demo',      label: '看動畫', icon: '▶️', color: 'blue' },
    { id: 'practice',  label: '跟著做', icon: '🎯', color: 'green' },
    { id: 'challenge', label: '挑戰區', icon: '⭐', color: 'purple' }
  ];
  const tabsBox = document.getElementById('tabs');
  const tabBtns = tabDefs.map(t => {
    const b = h('button', 'tab ' + t.color, t.icon + ' ' + t.label, tabsBox);
    b.addEventListener('click', () => showTab(t.id));
    return b;
  });
  function showTab(id) {
    tabDefs.forEach((t, i) => {
      tabBtns[i].classList.toggle('active', t.id === id);
      document.getElementById('panel-' + t.id).classList.toggle('active', t.id === id);
    });
    if (id === 'demo') anim.start(); else anim.stop();
  }
  showTab('demo');
})();
</script>
</body>
</html>
